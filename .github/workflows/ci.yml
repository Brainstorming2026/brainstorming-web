name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Mismo orden que `pnpm verify` en local. Un build roto (ej. un import a un
      # archivo borrado) debe fallar aquí y no al desplegar en Vercel.
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
